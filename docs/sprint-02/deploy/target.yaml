type: static_hosting
build:
  command: "npm ci && npm run build"
  artifacts: ["apps/frontend/dist"]
serve:
  command: "npm run preview"
  base_url: "http://localhost:4173"
smoke:
  path: "/"
  expect_status: 200
iac:
  tool: "terraform"
  dir: "docs/sprint-02/infra/terraform"
  plan_out: "docs/sprint-02/infra/terraform/plan.out"
